trigger:
- main

pool:
  vmImage: ubuntu-latest

# =========================
# 🔷 BUILD STAGE
# =========================
stages:

- stage: Build
  displayName: Build Java Application

  jobs:
  - job: MavenBuild
    displayName: Maven Build Job

    steps:

    # 🔹 Checkout code
    - checkout: self

    # 🔹 Build WAR using Maven
    - task: Maven@4
      displayName: Maven Clean Package
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'

    # 🔹 Verify WAR file
    - script: |
        echo "Checking build output..."
        ls -lh target
        jar -tf target/employee-app.war
      displayName: Verify WAR

    # 🔹 Publish artifact
    - publish: target/employee-app.war
      artifact: drop


# =========================
# 🔷 DEPLOY STAGE (EC2 + TOMCAT)
# =========================
- stage: Deploy_DEV
  displayName: Deploy to AWS EC2
  dependsOn: Build

  jobs:
  - job: Deploy
    displayName: Deploy WAR to EC2

    steps:

    # 🔹 Download artifact
    - download: current
      artifact: drop

    # =========================
    # 🔹 COPY WAR TO EC2
    # =========================
    - task: CopyFilesOverSSH@0
      displayName: Copy WAR to EC2
      inputs:
        sshEndpoint: 'EC2-DEV-SSH-CONN'   # 👈 MUST match Service Connection name
        sourceFolder: '$(Pipeline.Workspace)/drop'
        contents: 'employee-app.war'
        targetFolder: '/home/ubuntu/'

    # =========================
    # 🔹 DEPLOY TO TOMCAT
    # =========================
    - task: SSH@0
      displayName: Deploy WAR to Tomcat
      inputs:
        sshEndpoint: 'EC2-DEV-SSH-CONN'
        runOptions: 'commands'
        commands: |
          set -e

          echo "Stopping Tomcat..."
          /opt/tomcat/bin/shutdown.sh > /dev/null 2>&1 || true

          echo "Backing up old deployment..."
          if [ -f /opt/tomcat/webapps/employee-app.war ]; then
            sudo cp /opt/tomcat/webapps/employee-app.war \
                    /opt/tomcat/webapps/employee-app-$(date +%F-%H%M).war.bak
          else
            echo "No existing WAR found, skipping backup"
          fi

          echo "Cleaning old deployment..."
          sudo rm -rf /opt/tomcat/webapps/employee-app*

          echo "Deploying new WAR..."
          sudo cp /home/ubuntu/employee-app.war /opt/tomcat/webapps/

          echo "Starting Tomcat..."
          /opt/tomcat/bin/startup.sh > /dev/null 2>&1 || true

          echo "Waiting for application to initialize..."
          sleep 20

          echo "Deployment completed successfully"

    # =========================
    # 🔹 HEALTH CHECK
    # =========================
    - task: SSH@0
      displayName: Health Check
      inputs:
        sshEndpoint: 'EC2-DEV-SSH-CONN'
        runOptions: 'commands'
        commands: |
          echo "Checking application health..."

          curl -f http://localhost:8080/employee-app/ || exit 1

          echo "Application is healthy ✔"